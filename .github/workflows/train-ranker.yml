# Weekly training of the For you ranking v2 model (ml/elementml/bandit).
#
# What it does: runs the bandit tests (including the SQL parity test in PGlite) and the synthetic
# evaluation, then (only if both Supabase secrets are set) exports 60 days of events, pages and card
# features through service-role RPCs, fits the population prior, runs the go/no-go gate and writes one
# core.ml_models row plus its weights with api.ml_write_weights. Writing a model never changes the feed by
# itself: For you uses it only when foryou_ml_mode = 2 (set by hand) AND the model's gate passed.
#
# Safety: read-only repo token; actions pinned by commit SHA; Python wheels pinned by sha256
# (ml/requirements-ranker.txt, --require-hashes); PGlite pinned by its npm lockfile integrity hash; no
# artifacts, caches or uploads (the exported data holds reader ids); the data folder lives in the runner's
# temp folder and is deleted at the end even on failure; the Python steps print counts and pass/fail only;
# secrets are passed only to the steps that need them. Repository secrets: SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY.
#
# Schedule caveat: GitHub turns scheduled workflows off after 60 days without repository activity. Then no
# new model is written and the last passed weights stay in use (they never expire). api.ml_v2_check()
# (daily, pg_cron) reports stale = true once the newest model is older than v2_model_stale_days (21), so
# the watchdog or a person can notice; re-enable the workflow in the Actions tab or run it by hand
# (workflow_dispatch).

name: train-ranker

on:
  schedule:
    - cron: "23 7 * * 1"          # Mondays 07:23 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Write the model to Supabase (unchecked = dry run: export, train and gate only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: train-ranker
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 24

      - name: Install pinned, hash-checked Python libraries
        run: python -m pip install --disable-pip-version-check --no-cache-dir -q --require-hashes --only-binary=:all: -r requirements-ranker.txt

      - name: Install PGlite for the SQL parity test (lockfile with integrity hash, no install scripts)
        working-directory: ml/tests/pglite
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Unit tests and SQL parity
        env:
          REQUIRE_PGLITE: "1"
        run: PGLITE_PACKAGE_JSON="$GITHUB_WORKSPACE/ml/tests/pglite/package.json" python -m pytest tests/test_bandit.py -q -p no:cacheprovider

      - name: Synthetic evaluation (no reader data)
        run: python -m elementml.cli eval-bandit --workers 2 --out bandit_eval.json

      - name: Check that the secrets are configured
        id: secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Supabase secrets are not set: stopping after the synthetic evaluation."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export, train and gate
        if: steps.secrets.outputs.ok == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m elementml.cli bandit-export --data "$RUNNER_TEMP/ranker-data"
          python -m elementml.cli train-bandit --data "$RUNNER_TEMP/ranker-data"
          python -m elementml.cli bandit-gate --data "$RUNNER_TEMP/ranker-data" --synthetic results/bandit_eval.json

      - name: Publish the model
        if: steps.secrets.outputs.ok == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m elementml.cli bandit-publish --data "$RUNNER_TEMP/ranker-data"

      - name: Delete the exported data
        if: always()
        run: rm -rf "$RUNNER_TEMP/ranker-data" results tests/pglite/node_modules
