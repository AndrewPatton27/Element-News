# CI: runs on every push and pull request. Nothing here is scheduled (GitHub disables scheduled workflows after
# 60 days without repository activity, and the news pipeline does not run here: pg_cron in Supabase does).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secret scan (tracked files; no key shapes, no .env, CLAUDE.md, context/ or docs/)
        run: npm run scan:secrets
      - name: Type check app
        run: npx tsc --noEmit
      - name: Type check ingest, Edge Functions and watchdog
        run: |
          npx tsc --noEmit -p ingest/tsconfig.json
          npx tsc --noEmit -p supabase/functions/tsconfig.json
          npx tsc --noEmit -p workers/watchdog/tsconfig.json
      - name: App tests
        run: npm run test:app
      - name: Ingest tests
        run: npm run test:ingest
      - name: Edge Function tests
        run: npm run test:functions
      - name: Watchdog Worker tests
        run: npm run test:worker
      - name: Script tests
        run: npm run test:scripts

  # Runs every supabase/tests/*_check.sql in PGlite (in-memory Postgres) after all migrations.
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: SQL checks (PGlite)
        run: npm run test:sql

  # Playwright smoke test against mock data on a phone and a desktop viewport. Push and pull request only.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (with system libraries)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system libraries only (browser came from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The ml/ prototype tests (pure Python, no network).
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: ml tests
        working-directory: ml
        run: python -m pytest tests -q
